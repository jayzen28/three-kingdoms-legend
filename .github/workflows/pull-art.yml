name: pull-art
on:
  push:
    branches: [art-transfer]
    paths: ['.art-pull/request.txt']
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download art from Modal
        run: |
          set -e
          base=$(head -1 .art-pull/request.txt)
          mkdir -p art/characters
          tail -n +2 .art-pull/request.txt | while read key src; do
            [ -z "$key" ] && continue
            curl -fsSL --retry 3 "$base?name=$src" -o "art/characters/$key.png"
            echo "ok $key"
          done
          ls -la art/characters
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art
          git commit -m "Pull confirmed character art from Modal" || echo "nothing to commit"
          git push
