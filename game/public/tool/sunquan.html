<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>孫權 UR 分層立繪試作</title>
<style>
html,body{margin:0;height:100%;background:#07060a;color:#f0e8d8;font-family:"Noto Serif TC",serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;background:url(../img/bg_wu_5.webp) center/cover}
#stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(7,6,10,.7));pointer-events:none}
#stage canvas{position:absolute!important;left:50%;top:0;transform:translateX(-50%);margin:0!important;z-index:1;-webkit-mask-image:linear-gradient(#000 90%,transparent);mask-image:linear-gradient(#000 90%,transparent)}
#bar{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#120f14;border-top:1px solid #d4a853;font-size:13px;line-height:1.5}
#bar b{color:#d4a853}#bar .row{display:flex;gap:8px;align-items:center;margin-top:6px}
button.v{background:#2a2430;padding:6px 8px;font-size:12px}button.v.on{background:#d4a853;color:#120f14}
button{background:#e05858;color:#fff;border:1px solid #d4a853;border-radius:6px;padding:6px 12px;font:inherit}
input[type=range]{flex:1}
</style></head><body><div id="wrap"><div id="stage"></div>
<div id="bar"><b>孫權 UR｜分層立繪試作</b>　胸部、耳環、眼睛各一層，分開動。<br>可以按住胸部拖、點身體、左右滑。
<div class="row">胸部圖層<button class="v" data-v="art">美術交的</button><button class="v" data-v="ol">我圈的</button><a href="outline.html" style="color:#d4a853;margin-left:8px">去描邊 →</a></div>
<div class="row">淡化<input id="fe" type="range" min="0" max="40" step="2" value="6"><span id="fv">6</span></div>
<div class="row">邊緣<input id="rim" type="range" min="0" max="1" step="0.05" value="0.28"><span id="rv">0.28</span></div>
<div class="row">幅度<input id="amp" type="range" min="0.3" max="1.3" step="0.1" value="1"><span id="av">1.0</span><button id="poke">晃一下</button></div></div></div>
<script src="../js/layered.js"></script>
<script>
var stage=document.getElementById("stage"),amp=document.getElementById("amp"),ol=null,L=null;
try{ol=JSON.parse(localStorage.getItem("sg_outline_sunquan_ur"))}catch(e){}
var fe=document.getElementById("fe"),cur="art";
var mine=ol&&ol.L&&ol.R&&ol.L.length>2&&ol.R.length>2;
function load(m){cur=m;if(L){L.stop();L.canvas.remove()}L=SG.Layered.mount(stage,"sunquan_ur",m==="art"?{base:"../img/",amp:+amp.value,feather:+fe.value}:{base:"../img/",mode:"outline",outline:mine?ol:null,amp:+amp.value,feather:+fe.value});
  document.querySelectorAll("button.v").forEach(function(b){b.classList.toggle("on",b.dataset.v===m)})}
document.querySelectorAll("button.v").forEach(function(b){b.onclick=function(){load(b.dataset.v)}});load("art");
document.getElementById("rim").oninput=function(){L.params.RIM=+this.value;document.getElementById("rv").textContent=(+this.value).toFixed(2)};
fe.onchange=function(){document.getElementById("fv").textContent=this.value;load(cur)};
document.getElementById("poke").onclick=function(){L&&L.poke()};
amp.oninput=function(){L.params.amp=+this.value;document.getElementById("av").textContent=(+this.value).toFixed(1)};
</script></body></html>
