<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>胸口範圍標記工具｜三國LEGEND</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:#1c1512;color:#f0e8d8;-webkit-user-select:none;user-select:none}
header{padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#2a1d14;position:sticky;top:0;z-index:5}
header b{font-size:17px}header .cnt{color:#d4a853;font-variant-numeric:tabular-nums}
select,button,input{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid #6b5a45;background:#3a2a1f;color:#f0e8d8}
button{cursor:pointer}button.pri{background:#b3261e;border-color:#b3261e;color:#fff}button.ok{background:#2f7a52;border-color:#2f7a52;color:#fff}
main{display:flex;gap:16px;padding:14px;flex-wrap:wrap;justify-content:center}
.pane{position:relative;line-height:0;touch-action:none}
.pane img,.pane canvas{height:min(72vh,720px);width:auto;display:block;background:#555;border-radius:6px}
.pane svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.cap{line-height:1.5;font-size:13px;color:#cdbb92;text-align:center;margin-top:6px}
.el{fill:rgba(255,60,60,.22);stroke:#ff4a4a;stroke-width:.004;cursor:move}.el.r{fill:rgba(60,140,255,.22);stroke:#4aa3ff}
.hd{fill:#fff;stroke:#000;stroke-width:.003;cursor:nwse-resize}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 14px 10px}
textarea{width:100%;height:120px;font:12px monospace;background:#120d0a;color:#cdbb92;border:1px solid #6b5a45;border-radius:6px;padding:8px;user-select:text;-webkit-user-select:text}
.tip{padding:0 14px 14px;font-size:14px;line-height:1.7;color:#cdbb92;max-width:820px;margin:0 auto}
.done{color:#6fd39b}
</style></head><body>
<header>
  <b>胸口範圍標記</b>
  <select id="sel"></select>
  <label><input type="checkbox" id="todo"> 只看還沒確認的</label>
  <span class="cnt" id="cnt"></span>
</header>
<div class="bar">
  <button id="prev">← 上一位</button>
  <button class="ok" id="ok">✓ 確認這位，下一位</button>
  <button id="next">下一位 →</button>
  <button id="none">這位不做（沒露胸或被擋住）</button>
  <button id="reset">還原這位</button>
  <button class="pri" id="exp">匯出</button>
</div>
<main>
  <div><div class="pane" id="edit"><img id="img" alt=""><svg id="svg" viewBox="0 0 1 1" preserveAspectRatio="none"></svg></div><div class="cap">拖橢圓移動；拖白點改大小。紅＝畫面左邊那顆，藍＝右邊那顆</div></div>
  <div><div class="pane" id="prev-pane"></div><div class="cap">預覽（效果有加強，方便看範圍對不對）。點一下或拖動試試</div></div>
</main>
<div class="tip">
  <p>標法：兩個橢圓各包住一邊，<b>上緣貼在胸口上方、下緣包到底</b>，不要框到手臂、武器、項鍊。兩個橢圓可以重疊。只看得到一邊的，把另一個縮小疊在同一邊就好。</p>
  <p>進度存在這個瀏覽器裡，關掉再開還在。全部標完（或標一部分也可以）按「匯出」，把下面那串文字整段複製貼給 Claude。</p>
  <textarea id="out" readonly placeholder="按「匯出」後這裡會出現結果"></textarea>
  <button id="copy">複製</button> <span id="copied"></span>
</div>
<script>window.SG = {};</script>
<script src="../js/data.js"></script>
<script src="../js/jiggle.js"></script>
<script>
(function () {
  var KEY = "sg_chest_marks_v1", marks = {};
  try { marks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  var seen = {}, list = [];
  SG.CARDS.forEach(function (c) { if (c.art && !c.male && !c.artBg && !seen[c.art]) { seen[c.art] = 1; list.push({ art: c.art, name: c.gen, fac: c.fac }); } });
  var $ = function (s) { return document.querySelector(s); }, cur = 0, E = null;
  function init(art) {
    var m = marks[art]; if (m && m.v) return JSON.parse(JSON.stringify(m.v));
    var own = SG.JIGGLE[art]; if (own) return JSON.parse(JSON.stringify(own));
    var c = SG.CHEST[art]; if (c && typeof c[0] !== "number") return JSON.parse(JSON.stringify(c));
    if (!c) c = [0.5, 0.6, 0.3, 0.1];
    return [[c[0] - c[2] * 0.45, c[1], c[2] * 0.6, c[3]], [c[0] + c[2] * 0.45, c[1], c[2] * 0.6, c[3]]];
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} }
  function fill() {
    var todo = $("#todo").checked, sel = $("#sel"); sel.innerHTML = "";
    list.forEach(function (x, i) { var m = marks[x.art]; if (todo && m && m.done && i !== cur) return; var o = document.createElement("option"); o.value = i; o.textContent = (m && m.done ? "✓ " : "　") + x.fac + "｜" + x.name; sel.appendChild(o); });
    sel.value = cur; var n = list.filter(function (x) { return marks[x.art] && marks[x.art].done; }).length;
    $("#cnt").textContent = "已確認 " + n + " / " + list.length;
  }
  function draw() {
    var s = "";
    E.forEach(function (e, i) {
      s += '<ellipse class="el' + (i ? ' r' : '') + '" data-i="' + i + '" data-k="m" cx="' + e[0] + '" cy="' + e[1] + '" rx="' + e[2] + '" ry="' + e[3] + '"/>' +
        '<ellipse class="hd" data-i="' + i + '" data-k="x" cx="' + (e[0] + e[2]) + '" cy="' + e[1] + '" rx=".018" ry=".0125"/>' +
        '<ellipse class="hd" data-i="' + i + '" data-k="y" cx="' + e[0] + '" cy="' + (e[1] + e[3]) + '" rx=".018" ry=".0125"/>';
    });
    $("#svg").innerHTML = s;
  }
  var pt = null;
  function preview() {
    clearTimeout(pt); pt = setTimeout(function () {
      var x = list[cur], p = $("#prev-pane"); p.innerHTML = "";
      if (marks[x.art] && marks[x.art].none) { p.innerHTML = '<div class="cap" style="width:240px;padding:40px 0">這位設定為不做</div>'; return; }
      SG.JIGGLE[x.art] = JSON.parse(JSON.stringify(E));
      var im = new Image(); im.src = "../img/" + x.art + "_full.webp"; im.alt = x.name; p.appendChild(im);
    }, 250);
  }
  function show(i) {
    cur = (i + list.length) % list.length; var x = list[cur];
    $("#img").src = "../img/" + x.art + "_full.webp"; E = init(x.art); draw(); fill(); preview();
  }
  function step(d) {
    var todo = $("#todo").checked, i = cur;
    for (var k = 0; k < list.length; k++) { i = (i + d + list.length) % list.length; var m = marks[list[i].art]; if (!todo || !(m && m.done)) break; }
    show(i);
  }
  var drag = null, svg = $("#svg");
  function pos(e) { var r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; }
  svg.addEventListener("pointerdown", function (e) {
    var t = e.target; if (!t.dataset || t.dataset.i === undefined) return;
    var p = pos(e), i = +t.dataset.i; drag = { i: i, k: t.dataset.k, p: p, o: E[i].slice() }; svg.setPointerCapture(e.pointerId); e.preventDefault();
  });
  svg.addEventListener("pointermove", function (e) {
    if (!drag) return; var p = pos(e), o = drag.o, t = E[drag.i], r3 = function (v) { return Math.round(v * 1000) / 1000; };
    if (drag.k === "m") { t[0] = r3(Math.max(0, Math.min(1, o[0] + p[0] - drag.p[0]))); t[1] = r3(Math.max(0, Math.min(1, o[1] + p[1] - drag.p[1]))); }
    else if (drag.k === "x") t[2] = r3(Math.max(0.02, Math.abs(p[0] - t[0])));
    else t[3] = r3(Math.max(0.015, Math.abs(p[1] - t[1])));
    draw();
  });
  var end = function () { if (!drag) return; drag = null; var x = list[cur]; marks[x.art] = { v: E, done: !!(marks[x.art] && marks[x.art].done) }; save(); preview(); };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  $("#sel").onchange = function () { show(+this.value); };
  $("#todo").onchange = fill;
  $("#prev").onclick = function () { step(-1); }; $("#next").onclick = function () { step(1); };
  $("#ok").onclick = function () { var x = list[cur]; marks[x.art] = { v: E, done: true }; save(); step(1); };
  $("#none").onclick = function () { var x = list[cur]; marks[x.art] = { none: true, done: true }; save(); step(1); };
  $("#reset").onclick = function () { var x = list[cur]; delete marks[x.art]; delete SG.JIGGLE[x.art]; save(); show(cur); };
  $("#exp").onclick = function () {
    var out = {}; Object.keys(marks).forEach(function (k) { var m = marks[k]; if (m.done) out[k] = m.none ? null : m.v; });
    $("#out").value = "CHEST_MARKS " + JSON.stringify(out); $("#out").scrollIntoView({ behavior: "smooth" });
  };
  $("#copy").onclick = function () { var t = $("#out"); t.select(); try { navigator.clipboard.writeText(t.value); $("#copied").textContent = "已複製"; } catch (e) { document.execCommand("copy"); $("#copied").textContent = "已複製"; } };
  show(0);
})();
</script>
</body></html>
