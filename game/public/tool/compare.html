<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>分層 vs 圈範圍｜比較</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07060a;color:#f0e8d8;font-family:"Noto Serif TC",system-ui,serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#top,#bot{background:#120f14;padding:8px 10px;font-size:13px;line-height:1.5}#top{border-bottom:1px solid #d4a853}#bot{border-top:1px solid #d4a853;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}.row:first-child{margin-top:0}
button{background:#2a2430;color:#f0e8d8;border:1px solid #6b5a3a;border-radius:6px;padding:7px 10px;font:inherit;font-size:13px}button.on{background:#d4a853;color:#120f14;border-color:#d4a853}button.go{background:#e05858;border-color:#d4a853;color:#fff}
#mid{flex:1;min-height:0;display:flex}
.pane{flex:1;min-width:0;position:relative;overflow:hidden;background:#2a2230 center/cover}.pane+.pane{border-left:2px solid #d4a853}
.pane b{position:absolute;left:6px;top:6px;z-index:3;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:4px;font-size:12px;color:#d4a853}
.pane canvas,.pane img{position:absolute!important;top:0;height:100%;width:auto;max-width:none;margin:0!important;touch-action:none;transform:translateX(-50%)}
input[type=range]{flex:1;min-width:80px}
</style></head><body><div id="wrap">
<div id="top"><div class="row"><b style="color:#d4a853">比較</b><button class="c on" data-c="zhangliao">張遼（胸甲）</button><button class="c" data-c="zhanghe">張郃（布料）</button><button class="c" data-c="dianwei">典韋（皮膚）</button></div></div>
<div id="mid"><div class="pane" id="pa"><b>A 分層（美術切圖）</b></div><div class="pane" id="pb"><b>B 你圈的範圍（不用美術）</b></div></div>
<div id="bot">
  <div>兩邊都可以按住胸部拖、點一下。A 會眨眼。</div>
  <div class="row">B 幅度<button class="g on" data-g="0">遊戲現況（含蓄）</button><button class="g" data-g="1">加強</button><span style="flex:1"></span><button id="poke" class="go">兩邊一起晃</button></div>
  <div class="row">A 幅度<input id="amp" type="range" min="0.3" max="1.3" step="0.1" value="1"><span id="av">1.0</span></div>
</div></div>
<script>window.SG = {};</script>
<script src="../js/data.js"></script>
<script src="../js/layered.js"></script>
<script src="../js/jiggle.js"></script>
<script>
(function(){
var cur="zhangliao",strong=0,L=null,B=null,$=function(q){return document.querySelector(q)},pa=$("#pa"),pb=$("#pb"),BG={zhangliao:"bg_wei_2",zhanghe:"bg_wei_4",dianwei:"bg_wei_6"};
function focus(el){var c=SG.chestBox(cur),R=SG.Layered.RIG[cur],x=c?c[0]:(R.art[0][0]+R.art[1][0])/2;el.style.left="calc(50% + "+((0.5-x)*100)+"cqw)";
  var w=el.getBoundingClientRect().width||1,pw=pa.clientWidth;el.style.left=(pw/2+(0.5-x)*w)+"px"}
function load(){
  if(L){L.stop();L.canvas.remove()} pb.querySelectorAll("img,canvas").forEach(function(e){e.remove()});
  pa.style.backgroundImage=pb.style.backgroundImage="url(../img/"+BG[cur]+".webp)";
  L=SG.Layered.mount(pa,cur,{base:"../img/",amp:+$("#amp").value});L.canvas.style.cssText="";setTimeout(function(){focus(L.canvas)},50);
  var c=SG.CHEST[cur];if(strong)SG.JIGGLE[cur]=[c.L,c.R];else delete SG.JIGGLE[cur];
  var im=new Image();im._jg=true;im.onload=function(){im._jg=false;SG.Jiggle.attach(im,cur,{noLayer:true});setTimeout(function(){B=pb.querySelector("canvas");if(B)focus(B)},80)};pb.appendChild(im);im.src="../img/"+cur+"_full.webp";
}
document.querySelectorAll("button.c").forEach(function(b){b.onclick=function(){cur=b.dataset.c;document.querySelectorAll("button.c").forEach(function(x){x.classList.toggle("on",x===b)});load()}});
document.querySelectorAll("button.g").forEach(function(b){b.onclick=function(){strong=+b.dataset.g;document.querySelectorAll("button.g").forEach(function(x){x.classList.toggle("on",x===b)});load()}});
$("#amp").oninput=function(){L.params.amp=+this.value;$("#av").textContent=(+this.value).toFixed(1)};
$("#poke").onclick=function(){L&&L.poke();B=pb.querySelector("canvas");if(B&&B._kick)B._kick(0.2,-0.5)};
window.addEventListener("resize",function(){if(L)focus(L.canvas);if(B)focus(B)});load();window.__c={L:function(){return L}};
})();
</script></body></html>
