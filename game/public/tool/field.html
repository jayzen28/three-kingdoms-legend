<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>戰場試作｜斜視、會動的小兵、城堡與糧倉</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0a0d;color:#f0e8d8;font-family:"Noto Serif TC",system-ui,serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}

button{background:#2a2430;color:#f0e8d8;border:1px solid #6b5a3a;border-radius:6px;padding:7px 8px;font:inherit;font-size:13px;white-space:nowrap;flex:none}#top{gap:5px!important}#top button{padding:6px 7px}#turn{font-size:12px;white-space:nowrap}button.go{background:#e05858;border-color:#d4a853;color:#fff}button:disabled{opacity:.4}

.cell{position:absolute;border:1px solid rgba(40,30,15,.2)}
.cell[data-t="~"],.cell[data-t="="]{background:url(../img/bf/ground_water.webp) 0 0/256px 256px;border-color:rgba(20,60,110,.25)}.cell[data-t="="]::after{content:"";position:absolute;inset:-3px 9%;background:url(../img/bf/obj_bridge.webp) center/100% 100%}.cell[data-t="="].h::after{transform:rotate(90deg)}.cell[data-t="^"],.cell[data-t="M"],.cell[data-t="n"]{background:rgba(90,84,74,.28)}.cell[data-t="f"]{background:rgba(40,90,45,.25)}
.cell.mv{background:rgba(70,150,255,.34);border-color:rgba(120,190,255,.9)}.cell.at{background:rgba(255,70,60,.38);border-color:#ff8a7a}.cell.sel{background:rgba(255,220,90,.4);border-color:#ffe07a}

.flag{width:40px;height:62px;margin-left:-20px;margin-top:-74px;pointer-events:none}

.flag .ban{position:absolute;left:30px;bottom:-12px;width:33px;height:100px;background:url(../img/bf/flag_p.webp) 0 0/300% 100% no-repeat;animation:wave .9s step-end infinite}   /* ✅ Jay：飄揚的軍旗，寫武將的姓，三格動畫 */
.flag .ban.e{background-image:url(../img/bf/flag_e.webp)}
.flag .ban span{position:absolute;left:5px;top:9px;width:20px;height:24px;display:flex;align-items:center;justify-content:center;font:700 15px/1 "Ma Shan Zheng","Noto Serif TC",serif;color:#f6e7b4;text-shadow:0 0 2px #400,0 1px 1px #000}
.flag .ban.e span{color:#4a1c08;text-shadow:0 0 2px #fff6}.flag .ban span.two{font-size:10px;writing-mode:vertical-rl;letter-spacing:-1px}
@keyframes wave{0%{background-position:0 0}25%{background-position:50% 0}50%{background-position:100% 0}75%{background-position:50% 0}}

.sway img{transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite}
@keyframes flick{50%{filter:brightness(1.14) saturate(1.25)}}.bld .bi.fire img{animation:flick .4s step-end infinite}
.flag .face{position:absolute;left:2px;top:0;width:36px;height:36px;border-radius:50%;border:2px solid var(--c);background:#222 center/cover;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.flag .hp{position:absolute;left:-6px;top:38px;width:52px;text-align:center;font:700 11px/1 monospace;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.flag .bar{position:absolute;left:0;top:50px;width:40px;height:4px;background:#0008;border-radius:2px;overflow:hidden}.flag .bar b{display:block;height:100%;background:var(--c)}
.unit.done .up{filter:grayscale(1) brightness(.62)}
.pop{position:absolute;margin-top:-80px;transform-origin:50% 100%;font:900 20px/1 "Noto Serif TC",serif;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000;white-space:nowrap;pointer-events:none;animation:rise .9s ease-out forwards;margin-left:-40px;width:80px;text-align:center}
.pop.dmg{color:#ff6a5a;font-family:monospace}.pop.cry{color:#ffe07a;font-size:24px}

.bld{pointer-events:none}.bld svg{display:block}

.bld .tag u{display:block;height:4px;margin-top:2px;background:#333;border-radius:2px;overflow:hidden;text-decoration:none}.bld .tag u b{display:block;height:100%;background:var(--c)}
.bld.hit .bi{display:block;position:absolute;inset:0;animation:shake .3s linear 2}.bld .bi{display:block;position:absolute;inset:0}
.hot{position:absolute;border:2px dashed transparent;border-radius:6px}.hot.base{border:3px solid var(--c);background:color-mix(in srgb,var(--c) 30%,transparent);border-radius:4px}.hot.at{border-color:#ff8a7a;background:rgba(255,70,60,.3)}.hot.mv{border-color:#7ac0ff;background:rgba(70,150,255,.3)}
#info{min-height:38px}#info b{color:#d4a853}
.row{display:flex;gap:6px;align-items:center;margin-top:6px}
#end{margin-left:auto}
#rost{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:8;padding:10px}#rbox{background:#17131a;border:1px solid #d4a853;border-radius:8px;padding:10px;width:100%;max-width:560px;max-height:100%;overflow:auto;font-size:12px}
.rr{position:relative;display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto auto;column-gap:6px;padding:4px 0;border-top:1px solid #ffffff14}.rr em{grid-row:1/4;width:30px;height:30px;border-radius:50%;background:#333 center/cover;font-style:normal;text-align:center;line-height:30px;color:#d4a853}.rr b{grid-column:2;color:#f0e8d8}.rr span{grid-column:2;color:#b9ab8a}.rr u{grid-column:2;height:4px;background:#333;border-radius:2px;overflow:hidden;margin-top:2px}.rr u i{display:block;height:100%}.rr.out{opacity:.4}.rr:not(:has(em)){grid-template-columns:1fr;border:1px solid;border-radius:4px;padding:4px 6px;margin-bottom:4px}.rr:not(:has(em)) b,.rr:not(:has(em)) span,.rr:not(:has(em)) u{grid-column:1}
#over{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:9;text-align:center;font-size:26px;color:#d4a853;flex-direction:column;gap:14px}
</style></head><body><div id="wrap">
<div id="top"><span id="turn" style="line-height:1.3"></span><span style="flex:1"></span><button id="ros">部隊</button><button id="rl">⟲</button><button id="rr">⟳</button><button id="zo">－</button><button id="zi">＋</button><button id="snd">音：開</button><button id="edit" onclick="location.href='level.html'">編輯</button></div>
<div id="view"><div id="pan"><div id="board"></div></div><div id="rost"><div id="rbox"><div style="display:flex;align-items:center;margin-bottom:8px"><b style="color:#d4a853;font-size:16px">雙方部隊</b><span style="flex:1"></span><button onclick="document.getElementById('rost').style.display='none'">關閉</button></div><div id="rbody"></div></div></div><div id="over"><div id="otxt"></div><button class="go" onclick="location.reload()">再打一次</button><button id="backed2" style="display:none" onclick="location.href='level.html'">← 回編輯器</button></div></div>
<div id="bot"><div id="info"></div><div class="row"><button id="backed" style="display:none" onclick="location.href='level.html'">← 回編輯器</button><button id="wait" disabled>待命</button><button id="post" disabled>進駐糧倉</button><button id="end" class="go">結束回合</button></div></div>
</div>
<script>
(function(){
var $=function(q){return document.querySelector(q)},board=$("#board"),pan=$("#pan"),view=$("#view");
// 關卡：地形每格一個字  . 平地  ^ 山  ~ 水  = 橋  f 樹林  # 柵欄。用關卡編輯器（level.html）做的關卡，按「試玩」會帶到這裡
var DEF={name:"預設：渡河攻城",cols:12,rows:12,t:["............","............","....f.......","...f....nM..","~~~~=~~~~~~~","~~~~=~~~~=~~","..........^.","..f.........","..ff........","............","............","............"],
  castle:[1,1],granary:[10,10],p:[[9,7],[8,8],[7,9],[10,8],[8,10],[9,9]],e:[{x:3,y:2,typ:"法"},{x:2,y:3,typ:"槍"},{x:5,y:3,typ:"槍"},{x:6,y:2,typ:"弓"},{x:7,y:1,typ:"騎"},{x:1,y:3,typ:"騎"}]};
var LV=DEF;try{if(/[?&]level=test/.test(location.search)){var raw=JSON.parse(localStorage.getItem("sg_level_test"));if(raw&&raw.t&&raw.castle&&raw.granary)LV=raw}}catch(e){}
var COLS=LV.cols,ROWS=LV.rows,C=56,TILT=56,ROT=45;
function T(x,y){return x<0||y<0||x>=COLS||y>=ROWS?"^":(LV.t[y]||"").charAt(x)||"."}
var UP="rotateZ(calc(var(--rot) * -1)) rotateX(-"+TILT+"deg)";   // 立起來的東西永遠正對鏡頭，地圖怎麼轉都一樣
board.style.width=COLS*C+"px";board.style.height=ROWS*C+"px";board.style.left=-COLS*C/2+"px";board.style.top=-ROWS*C/2+"px";var GROUND={grass:"ground_plain",dirt:"ground_dirt",snow:"ground_snow"}[LV.bg]||"ground_plain";
board.style.background="none";(function(){var m=9,gd=document.createElement("div");gd.id="ground";gd.style.cssText="position:absolute;left:"+(-m*C)+"px;top:"+(-m*C)+"px;width:"+(COLS+2*m)*C+"px;height:"+(ROWS+2*m)*C+"px;background:url(../img/bf/"+GROUND+".webp) 0 0/"+(GROUND==="ground_plain"?"840px 840px":"384px 384px")+";pointer-events:none;z-index:-1;"+(GROUND==="ground_plain"?"filter:brightness(1.06);":"filter:contrast(.62) brightness(1.12);")+"-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)";board.appendChild(gd)})();   // ✅ Jay：底圖要比格子大
var zoom=1,px=0,py=-120;function depth(x,y){var a=ROT*Math.PI/180;return Math.round(x*Math.sin(a)+y*Math.cos(a))+3000}   // 越靠近鏡頭的越晚畫
function place(){board.style.setProperty("--rot",ROT+"deg");pan.style.transform="translate("+px+"px,"+py+"px) scale("+zoom+") rotateX("+TILT+"deg) rotateZ("+ROT+"deg)"}place();
function resort(){board.querySelectorAll(".g").forEach(function(g){if(g.style.zIndex==="9999"||g.style.zIndex==="9998")return;g.style.zIndex=depth(parseFloat(g.style.left),parseFloat(g.style.top))+(+g.dataset.z||0)})}
// ── 資料 ─────────────────────────────────────────────
var COL={p:"#4ec87a",e:"#e0b030"},ADV={"槍":"騎","騎":"弓","弓":"槍"};
function U(side,name,art,typ,troops,atk,x,y,o){var mv={"槍":2,"騎":3,"弓":2,"法":2,"刺":2}[typ],r={"弓":[2,3],"法":[1,3]}[typ]||[1,1];return Object.assign({side:side,name:name,art:art,typ:typ,troops:troops,max:troops,atk:atk,mv:mv,rng:r,x:x,y:y,done:false,post:null},o||{})}
var PG=[["關羽","guanyu","騎",6000,1500],["張飛","zhangfei","槍",7000,1300],["趙雲","zhaoyun","騎",6000,1450],["黃忠","huangzhong","弓",5000,1250],["諸葛亮","zhugeliang","法",5000,1350],["劉備","liubei","槍",6000,1100]];
var ES={"槍":[4000,950],"騎":[4000,1000],"弓":[3000,900],"法":[3500,1000],"刺":[3000,1050]},units=[];
(LV.p||[]).slice(0,PG.length).forEach(function(c,i){var g=PG[i];units.push(U("p",g[0],g[1],g[2],g[3],g[4],c[0],c[1]))});
units.push(U("e","張角","zhangjiao","法",7000,1400,-1,-1,{post:"castle"}));
(LV.e||[]).forEach(function(o,i){var st=ES[o.typ]||ES["槍"];units.push(U("e","黃巾"+o.typ+"兵","",o.typ,st[0],st[1],o.x,o.y,{role:o.typ==="騎"?"raid":"def"}))});
units.forEach(function(u,i){u.id=i});
var B={castle:{side:"e",name:"城門",hp:4000,max:4000,cells:[LV.castle.slice()]},granary:{side:"p",name:"糧倉",hp:3000,max:3000,cells:[LV.granary.slice()]}};   // ✅ Jay：城和倉各佔一格
var turn=1,phase="p",sel=null,busy=false,snd=true;
// ── 小兵圖（先用程式畫的佔位圖，之後換美術）──────────────
var SN={"槍":"spear","騎":"cav","弓":"bow","法":"mage","刺":"assassin"};
function soldier(typ,side){return '<img src="../img/bf/sol_'+side+'_'+SN[typ]+'.webp" alt="" draggable="false">'}   // 美術 2026-11-15 交的小兵
var SLOT=[[0,6],[-15,-8],[15,-8],[-15,18],[15,18],[0,-21],[0,26],[-24,5],[24,5]];
function nMen(u){return Math.max(1,Math.min(9,Math.ceil(u.troops/1000)))}
// ── 畫面元素 ─────────────────────────────────────────
var SNOW=LV.bg==="snow"?"_snow":"",PROP={"^":1,"M":1,"n":1,"f":1,"#":1};   // ✅ Jay：山分大中小、雪地換雪山；樹林一格塞三四棵
function upimg(n,w,h,ox,oy,cls,dl){return '<div class="up '+(cls||"")+'" style="transform:'+UP+';left:'+ox+'px;top:'+oy+'px;width:'+w+'px;height:'+h+'px;margin:-'+(h-6)+'px 0 0 -'+w/2+'px;pointer-events:none"><img src="../img/bf/'+n+'.webp" alt="" style="position:absolute;left:50%;bottom:'+(/mtn/.test(n)?-14:0)+'%;max-width:100%;max-height:100%;transform:translateX(-50%);animation-delay:-'+(dl||0)+'s"></div>'}
function prop(x,y,ch){var g=document.createElement("div");g.className="g";g.dataset.z="0";g.style.left=(x+.5)*C+"px";g.style.top=(y+.5)*C+"px";var r=x*7+y*13,h;
  if(ch==="f"){var o=[[-13,-14],[14,-10],[-11,12],[13,15]];if(r%3===0)o.splice(r%4,1);h=o.map(function(q,i){return upimg("obj_tree_"+((r+i*3)%4+1),36,46+((r+i)%3)*7,q[0],q[1],"sway",((r+i*5)%7)*.45)}).join("")}
  else if(ch==="#")h=upimg("obj_fence",70,46,0,0);
  else{var m=ch==="M"?["obj_mtn_l",64,116]:ch==="n"?["obj_mtn_s",54,46]:["obj_mtn_m",66,80];h=upimg(m[0]+SNOW,m[1],m[2],0,0)}
  g.innerHTML=h;board.appendChild(g)}
var cells={};for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){var d=document.createElement("div");d.className="cell";d.dataset.t=T(x,y);if(PROP[T(x,y)])prop(x,y,T(x,y));if(T(x,y)==="="&&!(T(x-1,y)==="~"||T(x+1,y)==="~"||T(x-1,y)==="="||T(x+1,y)==="=")){d.dataset.h="1";d.className="cell h"}   // 橋的方向：河是直的就轉 90 度
  d.style.backgroundPosition=(-x*C)+"px "+(-y*C)+"px";d.style.cssText="left:"+x*C+"px;top:"+y*C+"px;width:"+C+"px;height:"+C+"px";d.dataset.k="c";d.dataset.x=x;d.dataset.y=y;board.appendChild(d);cells[x+","+y]=d}
function bpos(k){var c=B[k].cells[0];return [(c[0]+.5)*C,(c[1]+.5)*C]}
function gpos(u){if(u.post)return bpos(u.post);return [(u.x+.5)*C,(u.y+.5)*C]}
function lift(u){return u.post?" translateY(-88px)":""}   // 進駐的部隊：旗子掛在建築上方
function sur(u){if(!u.art)return u.typ;var n=u.name,t=n.slice(0,2);return ["諸葛","司馬","夏侯","公孫","太史","皇甫"].indexOf(t)>=0?t:n.charAt(0)}
function mk(u){
  var g=document.createElement("div");g.className="g unit";g.dataset.k="u";g.dataset.id=u.id;g.style.setProperty("--c",COL[u.side]);u.el=g;board.appendChild(g);
  var f=document.createElement("div");f.className="up flag";f.style.transform=UP;f.style.left="0px";f.style.top="0px";
  f.innerHTML='<div class="ban '+u.side+'" style="animation-delay:-'+(u.id%4*.2)+'s"><span'+(sur(u).length>1?' class="two"':'')+'>'+sur(u)+'</span></div><div class="face"'+(u.art?' style="background-image:url(../img/'+u.art+'_head.webp)"':"")+'>'+(u.art?"":'<span style="display:block;text-align:center;line-height:32px;font-size:15px;color:'+COL[u.side]+'">'+u.typ+'</span>')+'</div><div class="hp"></div><div class="bar"><b></b></div>';g.appendChild(f);u.flag=f;
  u.men=[];draw(u);
}
function draw(u){
  var p=gpos(u);u.el.style.left=p[0]+"px";u.el.style.top=p[1]+"px";u.el.dataset.z=u.post?3:1;u.el.style.zIndex=depth(p[0],p[1])+(u.post?3:1);u.flag.style.transform=UP+lift(u);u.el.classList.toggle("done",!!u.done);
  var n=u.troops>0?nMen(u):0;
  while(u.men.length<n){var i=u.men.length,s=document.createElement("div");s.className="up sol";var ring=u.post?[[20,20],[-4,26],[26,-4],[30,12],[12,30],[-18,22],[22,-18],[34,30],[0,36]][i]:SLOT[i];s.style.transform=UP;s.style.left=ring[0]+"px";s.style.top=ring[1]+"px";s.innerHTML="<i style='animation-delay:-"+(Math.random()*1.1).toFixed(2)+"s'>"+soldier(u.typ,u.side)+"</i>";u.el.appendChild(s);u.men.push(s)}
  u.flag.querySelector(".hp").textContent=Math.max(0,Math.round(u.troops));u.flag.querySelector(".bar b").style.width=Math.max(0,u.troops/u.max*100)+"%";
  u.el.style.display=u.troops>0?"":"none";
}
function fall(u){var n=u.troops>0?nMen(u):0;while(u.men.length>n){var s=u.men.pop();s.classList.add("dead");(function(s){setTimeout(function(){s.remove()},520)})(s)}}
function bimg(k,dead){return '<img src="../img/bf/bld_'+(k==="castle"?(dead?"castle_broken":"castle"):(dead?"granary_burnt":"granary"))+'.webp" alt="" draggable="false" style="position:absolute;left:50%;bottom:'+(k==="castle"?-24:-30)+'%;height:100%;transform:translateX(-50%)">'}   // ✅ Jay：建築的地基要壓在它那一格上，不是浮在格子後面
function mkB(k){var b=B[k],p=bpos(k),c=b.cells[0],g=document.createElement("div");g.className="g";g.style.left=p[0]+"px";g.style.top=p[1]+"px";g.dataset.z="2";g.style.zIndex=depth(p[0],p[1])+2;board.appendChild(g);
  var u=document.createElement("div");u.className="up bld";u.style.cssText="width:86px;height:82px;margin-left:-43px;margin-top:-74px;transform:"+UP;u.style.setProperty("--c",COL[b.side]);
  u.innerHTML='<span class="bi">'+bimg(k,false)+'</span><div class="tag"><span></span><u><b></b></u></div>';g.appendChild(u);b.el=u;
  var hot=document.createElement("div");hot.className="hot base";hot.dataset.k="b";hot.dataset.b=k;hot.style.cssText="left:"+c[0]*C+"px;top:"+c[1]*C+"px;width:"+C+"px;height:"+C+"px";hot.style.setProperty("--c",COL[b.side]);board.appendChild(hot);b.hot=hot;drawB(k)}
function drawB(k){var b=B[k];if(b.hp<=0&&!b.dead){b.dead=true;b.el.querySelector(".bi").innerHTML=bimg(k,true);b.el.querySelector(".bi").classList.add("fire")}b.el.querySelector(".tag span").textContent=b.name+" "+Math.max(0,Math.round(b.hp));b.el.querySelector(".tag b").style.width=Math.max(0,b.hp/b.max*100)+"%"}
mkB("castle");mkB("granary");units.forEach(mk);
// ── 規則 ─────────────────────────────────────────────
function at(x,y){for(var i=0;i<units.length;i++){var u=units[i];if(u.troops>0&&!u.post&&u.x===x&&u.y===y)return u}return null}
function inB(x,y){for(var k in B){var c=B[k].cells;for(var i=0;i<c.length;i++)if(c[i][0]===x&&c[i][1]===y)return k}return null}
var BLOCK={"^":1,"M":1,"n":1,"~":1,"#":1};function cost(x,y){return T(x,y)==="f"?2:1}   // ★ 山、水、柵欄不能走；樹林走進去要花 2 步
function free(x,y){return x>=0&&y>=0&&x<COLS&&y<ROWS&&!BLOCK[T(x,y)]&&!inB(x,y)&&!at(x,y)}
function reach(u){var out={},q=[[u.x,u.y,0]];out[u.x+","+u.y]=0;while(q.length){q.sort(function(a,b){return a[2]-b[2]});var c=q.shift();[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var nx=c[0]+d[0],ny=c[1]+d[1],k=nx+","+ny;if(!free(nx,ny))return;var w=c[2]+cost(nx,ny);if(w<=u.mv&&(!(k in out)||out[k]>w)){out[k]=w;q.push([nx,ny,w])}})}return out}
function posOf(u){if(u.post)return B[u.post].cells[0];return [u.x,u.y]}
function distB(x,y,k){var m=99;B[k].cells.forEach(function(c){m=Math.min(m,Math.abs(c[0]-x)+Math.abs(c[1]-y))});return m}
function distU(a,b){var p=posOf(a),q=posOf(b);if(b.post)return distB(p[0],p[1],b.post);if(a.post)return distB(q[0],q[1],a.post);return Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1])}
function canHit(u,d){return d>=u.rng[0]&&d<=u.rng[1]}
function guard(k){for(var i=0;i<units.length;i++)if(units[i].post===k&&units[i].troops>0)return units[i];return null}
function targets(u){var t=[];units.forEach(function(v){if(v.side!==u.side&&v.troops>0&&canHit(u,distU(u,v)))t.push({u:v})});for(var k in B)if(B[k].side!==u.side&&B[k].hp>0){var p=posOf(u);if(canHit(u,distB(p[0],p[1],k)))t.push({b:k})}return t}
function dmg(a,v){var m=a.atk*Math.sqrt(a.troops/a.max)*(0.9+Math.random()*0.2);if(ADV[a.typ]===v.typ)m*=1.5;if(ADV[v.typ]===a.typ)m*=0.75;if(v.post)m*=0.6;else if(T(v.x,v.y)==="f")m*=0.8;return Math.round(m)}   // ★ 站在樹林裡受傷 ×0.8   // ★ 進駐的部隊受傷 ×0.6
function dmgB(a,k){var m=a.atk*0.7*Math.sqrt(a.troops/a.max);if(guard(k))m*=0.5;return Math.round(m)}                                                                              // ★ 有人守時城門／糧倉受傷減半
// ── 演出 ─────────────────────────────────────────────
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function pop(gx,gy,txt,cls){var g=document.createElement("div");g.className="g";g.style.left=gx+"px";g.style.top=gy+"px";g.style.zIndex=9999;var p=document.createElement("div");p.className="up pop "+(cls||"");p.style.transform=UP;p.textContent=txt;g.appendChild(p);board.appendChild(g);setTimeout(function(){g.remove()},950)}
var AC=null;function roar(){if(!snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime,n=AC.createBuffer(1,AC.sampleRate*0.7,AC.sampleRate),d=n.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(0.6+0.4*Math.sin(i/AC.sampleRate*38));
  var s=AC.createBufferSource();s.buffer=n;var f=AC.createBiquadFilter();f.type="bandpass";f.frequency.setValueAtTime(420,t);f.frequency.linearRampToValueAtTime(820,t+0.5);f.Q.value=1.1;var g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.5,t+0.12);g.gain.exponentialRampToValueAtTime(0.01,t+0.68);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
  var o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(110,t+0.3);o.frequency.exponentialRampToValueAtTime(45,t+0.5);og.gain.setValueAtTime(0.7,t+0.3);og.gain.exponentialRampToValueAtTime(0.01,t+0.55);o.connect(og);og.connect(AC.destination);o.start(t+0.3);o.stop(t+0.6)}catch(e){}}
async function charge(a,tx,ty,ranged){
  var p=gpos(a);roar();pop(p[0],p[1],a.side==="p"?"殺——！":"喝啊！","cry");a.men.forEach(function(s){s.classList.add("jab")});
  if(!ranged&&!a.post){a.el.style.transition="left .2s ease-in,top .2s ease-in";a.el.style.left=p[0]+(tx-p[0])*0.6+"px";a.el.style.top=p[1]+(ty-p[1])*0.6+"px"}
  await sleep(ranged?330:260);
  if(ranged){var g=document.createElement("div");g.className="g";g.style.cssText="left:"+p[0]+"px;top:"+p[1]+"px;z-index:9998;transition:left .22s linear,top .22s linear";g.innerHTML='<div class="up" style="transform:'+UP+';margin:-34px 0 0 -6px;width:12px;height:12px;border-radius:50%;background:'+(a.typ==="法"?"#9be0ff":"#f4e9c0")+';box-shadow:0 0 10px '+(a.typ==="法"?"#6cf":"#fff")+'"></div>';board.appendChild(g);await sleep(20);g.style.left=tx+"px";g.style.top=ty+"px";await sleep(240);g.remove()}
}
async function back(a){var p=gpos(a);a.el.style.transition="left .22s ease-out,top .22s ease-out";a.el.style.left=p[0]+"px";a.el.style.top=p[1]+"px";await sleep(230);a.el.style.transition="";a.men.forEach(function(s){s.classList.remove("jab")})}
async function attack(a,t){
  busy=true;clearHL();var ranged=a.rng[1]>1;
  if(t.u){var v=t.u,q=gpos(v);await charge(a,q[0],q[1],ranged);var d=dmg(a,v);v.troops-=d;v.el.classList.add("hit");pop(q[0],q[1],"-"+d,"dmg");draw(v);fall(v);await sleep(380);v.el.classList.remove("hit");
    if(v.troops>0&&a.troops>0&&canHit(v,distU(v,a))){var p=gpos(a),d2=Math.round(dmg(v,a)*0.5);v.men.forEach(function(s){s.classList.add("jab")});await sleep(200);a.troops-=d2;a.el.classList.add("hit");pop(p[0],p[1],"-"+d2,"dmg");draw(a);fall(a);await sleep(320);a.el.classList.remove("hit");v.men.forEach(function(s){s.classList.remove("jab")})}
    if(v.troops<=0){pop(q[0],q[1],v.name+" 敗走","cry");draw(v)}}
  else{var b=B[t.b],bp=bpos(t.b),bx=bp[0],by=bp[1];await charge(a,bx,by,ranged);var d3=dmgB(a,t.b);b.hp-=d3;b.el.classList.add("hit");pop(bx,by,"-"+d3,"dmg");drawB(t.b);await sleep(420);b.el.classList.remove("hit")}
  await back(a);a.done=true;draw(a);busy=false;hud();check();
}
// ── 操作 ─────────────────────────────────────────────
function clearHL(){for(var k in cells)cells[k].className="cell"+(cells[k].dataset.h?" h":"");for(var b in B)B[b].hot.className="hot base";units.forEach(function(u){u.flag.style.filter=""})}
function info(t){$("#info").innerHTML=t}
function showSel(){
  clearHL();$("#wait").disabled=!sel;$("#post").disabled=true;
  if(!sel){info("<b>"+(LV.name||"")+"</b>　點我方部隊下指令：每隊每回合移動一次、行動一次。攻破<b>城門</b>就贏；<b>糧倉</b>被打掉就輸。單指拖動，<b>雙指旋轉和縮放</b>，或按上面 ⟲ ⟳。");return}
  var u=sel;info("<b>"+u.name+"</b>　"+u.typ+"兵　兵力 "+Math.round(u.troops)+"　移動 "+u.mv+"　射程 "+u.rng.join("–")+(u.post?"　<b>駐守糧倉中</b>（受傷 ×0.6）":u.moved?"　<b>已移動</b>：只能攻擊或待命":""));
  if(!u.post){cells[u.x+","+u.y].classList.add("sel");if(!u.moved){var r=reach(u);for(var k in r)if(r[k]>0)cells[k].classList.add("mv")}
    if(!guard("granary")&&distB(u.x,u.y,"granary")===1)$("#post").disabled=false}
  targets(u).forEach(function(t){if(t.u){if(t.u.post)B[t.u.post].hot.classList.add("at");else cells[t.u.x+","+t.u.y].classList.add("at")}else B[t.b].hot.classList.add("at")});
}
function pick(u){sel=u;showSel()}
async function tap(el){
  if(busy||phase!=="p")return;var k=el&&el.dataset.k;if(!k){sel=null;showSel();return}
  if(k==="u"){var w=units[+el.dataset.id];el=w.post?B[w.post].hot:cells[w.x+","+w.y];k=el.dataset.k}   // 點到小兵或旗子＝點那一格
  if(k==="b"){var bk=el.dataset.b,g=guard(bk);
    if(sel&&B[bk].side!=="p"){var ts=targets(sel),tb=ts.filter(function(t){return t.b===bk})[0],tg=ts.filter(function(t){return t.u&&t.u.post===bk})[0];
      if(tb||tg){var a=sel;sel=null;await attack(a,tb||tg);showSel();return}}   // 城堡：優先打城門
    if(B[bk].side==="p"&&g&&!g.done){pick(g);return}
    info("<b>"+B[bk].name+"</b> "+Math.round(B[bk].hp)+"／"+B[bk].max+(g?"　守將："+g.name+"（兵力 "+Math.round(g.troops)+"）":"　無人駐守"));return}
  var x=+el.dataset.x,y=+el.dataset.y,v=at(x,y);
  if(sel&&v&&v.side==="e"){var t=targets(sel).filter(function(t){return t.u===v})[0];if(t){var a2=sel;sel=null;await attack(a2,t);showSel();return}}
  if(v&&v.side==="p"&&!v.done){pick(v);return}
  if(v){info("<b>"+v.name+"</b>　"+v.typ+"兵　兵力 "+Math.round(v.troops)+(v.done?"　（已行動）":""));return}
  if(sel&&!sel.post&&!sel.moved){var r=reach(sel);if((x+","+y) in r&&r[x+","+y]>0){var w2=sel;w2.x=x;w2.y=y;w2.moved=true;draw(w2);busy=true;await sleep(300);busy=false;
      if(!targets(w2).length&&!(distB(x,y,"granary")===1&&!guard("granary"))){w2.done=true;draw(w2);sel=null}   // 走完沒東西可打就直接結束這隊
      showSel();return}}
  sel=null;showSel();
}
$("#wait").onclick=function(){if(sel&&!busy){sel.done=true;draw(sel);sel=null;showSel()}};
$("#post").onclick=function(){if(sel&&!busy&&!guard("granary")){var u=sel;u.post="granary";u.x=u.y=-1;u.done=true;u.men.forEach(function(s){s.remove()});u.men=[];draw(u);sel=null;showSel()}};
function check(){var o=null;if(B.castle.hp<=0)o="城門攻破！<br>勝利";else if(B.granary.hp<=0)o="糧倉被毀…<br>敗北";else if(!units.some(function(u){return u.side==="p"&&u.troops>0}))o="全軍覆沒…<br>敗北";
  if(o){$("#otxt").innerHTML=o;$("#over").style.display="flex";busy=true}return !!o}
function tot(s){return Math.round(units.reduce(function(a,u){return a+(u.side===s&&u.troops>0?u.troops:0)},0))}
function hud(){$("#turn").innerHTML="第 "+turn+" 回合・"+(phase==="p"?"我方":"敵方")+'<br><span style="color:'+COL.p+'">'+tot("p")+'</span> : <span style="color:'+COL.e+'">'+tot("e")+'</span>'}
function roster(){var h='<div style="display:flex;gap:10px;width:100%">';["p","e"].forEach(function(sd){var k=sd==="p"?"granary":"castle",b=B[k];
  h+='<div style="flex:1;min-width:0"><div style="color:'+COL[sd]+';font-weight:700;margin-bottom:4px">'+(sd==="p"?"我方（攻）":"敵方（守）")+'　總兵力 '+tot(sd)+'</div><div class="rr" style="border-color:'+COL[sd]+'"><b>'+b.name+'</b><span>'+Math.max(0,Math.round(b.hp))+'／'+b.max+'</span><u><i style="width:'+Math.max(0,b.hp/b.max*100)+'%;background:'+COL[sd]+'"></i></u></div>';
  units.filter(function(u){return u.side===sd}).forEach(function(u){var st=u.troops<=0?"敗走":u.post?"駐守":u.done?"已行動":"";
    h+='<div class="rr'+(u.troops<=0?" out":"")+'"><em'+(u.art?' style="background-image:url(../img/'+u.art+'_head.webp)"':"")+'>'+(u.art?"":u.typ)+'</em><b>'+u.name+'</b><span>'+u.typ+'　'+Math.max(0,Math.round(u.troops))+(st?"　"+st:"")+'</span><u><i style="width:'+Math.max(0,u.troops/u.max*100)+'%;background:'+COL[sd]+'"></i></u></div>'});h+="</div>"});
  $("#rbody").innerHTML=h+"</div>";$("#rost").style.display="flex"}
// ── 敵方 AI（很簡單，只為了看演出）─────────────────────
async function enemy(){
  phase="e";hud();sel=null;clearHL();info("敵方行動中…");$("#end").disabled=true;units.forEach(function(u){if(u.side==="e"){u.done=false;draw(u)}});
  for(var i=0;i<units.length;i++){var u=units[i];if(u.side!=="e"||u.troops<=0)continue;if($("#over").style.display==="flex")return;
    if(!u.post){var goal=null;
      if(u.role==="raid")goal={b:"granary"};else{var best=null,bd=99;units.forEach(function(v){if(v.side==="p"&&v.troops>0){var d=distU(u,v);if(d<bd){bd=d;best=v}}});if(best)goal={u:best}}
      if(goal&&!targets(u).length){var r=reach(u),bk=null,bs=99;for(var k in r){var c=k.split(",").map(Number),d2=goal.b?distB(c[0],c[1],goal.b):(goal.u.post?distB(c[0],c[1],goal.u.post):Math.abs(c[0]-goal.u.x)+Math.abs(c[1]-goal.u.y));var sc=Math.abs(d2-u.rng[1])+ (d2<u.rng[0]?5:0);if(sc<bs){bs=sc;bk=c}}
        if(bk&&(bk[0]!==u.x||bk[1]!==u.y)){u.x=bk[0];u.y=bk[1];draw(u);await sleep(330)}}}
    var ts=targets(u);if(ts.length){var t=u.role==="raid"?(ts.filter(function(t){return t.b})[0]||ts[0]):ts.sort(function(a,b){return (a.u?a.u.troops:1e9)-(b.u?b.u.troops:1e9)})[0];await attack(u,t);await sleep(150)}}
  if($("#over").style.display==="flex")return;
  units.forEach(function(u){u.done=false;u.moved=false});turn++;phase="p";busy=false;units.forEach(draw);hud();$("#end").disabled=false;showSel();
}
$("#end").onclick=function(){if(!busy&&phase==="p")enemy()};
// ── 拖動、縮放、點擊 ─────────────────────────────────
var PT={},dn=null,g2=null;
function two(){var k=Object.keys(PT);if(k.length<2)return null;var a=PT[k[0]],b=PT[k[1]];return {ang:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI,dist:Math.hypot(b.x-a.x,b.y-a.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}
view.addEventListener("pointerdown",function(e){PT[e.pointerId]={x:e.clientX,y:e.clientY};try{view.setPointerCapture(e.pointerId)}catch(x){}
  if(Object.keys(PT).length===1)dn={x:e.clientX,y:e.clientY,px:px,py:py,mv:false};else{var t=two();g2={ang:t.ang,dist:t.dist,rot:ROT,zoom:zoom,mx:t.mx,my:t.my,px:px,py:py};if(dn)dn.mv=true}});

  if(g2){var t=two();if(!t)return;ROT=g2.rot+(t.ang-g2.ang);zoom=Math.max(0.4,Math.min(2,g2.zoom*t.dist/g2.dist));px=g2.px+t.mx-g2.mx;py=g2.py+t.my-g2.my;place();resort();return}   // 雙指：轉、縮放、一起拖
  if(!dn)return;var dx=e.clientX-dn.x,dy=e.clientY-dn.y;if(Math.abs(dx)+Math.abs(dy)>8)dn.mv=true;if(dn.mv){px=dn.px+dx;py=dn.py+dy;place()}});
function upx(e){var was=!!g2;delete PT[e.pointerId];if(Object.keys(PT).length<2)g2=null;if(Object.keys(PT).length>0||!dn)return;var d=dn;dn=null;if(d.mv||was||e.type==="pointercancel")return;
  var el=document.elementFromPoint(e.clientX,e.clientY);while(el&&el!==view&&!(el.dataset&&el.dataset.k))el=el.parentElement;tap(el&&el!==view?el:null)}

function spin(d){var t0=ROT,t1=ROT+d,n=0;(function f(){n++;ROT=t0+(t1-t0)*n/8;place();resort();if(n<8)requestAnimationFrame(f)})()}
