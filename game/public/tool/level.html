<style>

</style></head><body><div id="wrap">
<div id="top">
  <div class="row"><b style="color:#d4a853">關卡編輯器</b><input id="name" type="text" placeholder="關卡名稱" maxlength="20">
    <select id="cols"></select>×<select id="rows"></select><select id="bg"><option value="grass">草地</option><option value="dirt">黃土</option><option value="snow">雪地</option></select></div>

</div></div>

<script>
(function(){
var $=function(q){return document.querySelector(q)},KEY="sg_levels",grid=$("#grid");
// 筆刷：地形（每格一種）／ 建築（各一座）／ 部隊
var TOOLS=[
 {k:"t.",n:"平地",c:"#b9ae84"},{k:"tn",n:"小山",c:"#8d877c",s:"△"},{k:"t^",n:"中山",c:"#7d776c",s:"▲"},{k:"tM",n:"大山",c:"#5d584f",s:"▲▲"},{k:"t~",n:"水",c:"#3c78be",s:"≈"},{k:"t=",n:"橋",c:"#9a7646",s:"="},{k:"tf",n:"樹林",c:"#3b7d45",s:"♣"},{k:"t#",n:"柵欄",c:"#8a6a3e",s:"卌"},{sep:1},
 {k:"castle",n:"城",c:"#6b5a3a",s:"城"},{k:"granary",n:"糧倉",c:"#7a5632",s:"倉"},{sep:1},
 {k:"p",n:"我方",c:"#2f9a5c",s:"我"},{k:"e槍",n:"敵槍兵",c:"#c79a1c",s:"槍"},{k:"e騎",n:"敵騎兵",c:"#c79a1c",s:"騎"},{k:"e弓",n:"敵弓兵",c:"#c79a1c",s:"弓"},{k:"e法",n:"敵法師",c:"#c79a1c",s:"法"},{k:"e刺",n:"敵刺客",c:"#c79a1c",s:"刺"},{k:"x",n:"拿掉部隊",c:"#444",s:"✕"}];
var HINT={"t.":"平地：正常走。","tn":"小山：不能走，矮，不太擋視線。","t^":"中山：不能走。","tM":"大山：不能走，很高，會擋到後面的東西。雪地底圖會自動換成雪山。","t~":"水：不能走，要過河得放橋。","t=":"橋：可以走，放在水上。","tf":"樹林：走進去要花 2 步；站在裡面受傷打八折。","t#":"柵欄：不能走（之後可以做成能打壞）。",
 castle:"城：守方（敵方）的城，全場一座。點哪裡就搬到哪裡。城門被攻破守方就輸。",granary:"糧倉：攻方（我方）的糧倉，全場一座。被打掉攻方就輸。",
 p:"我方出場格：最多 6 格，數字是出場順序（1 關羽、2 張飛、3 趙雲、4 黃忠、5 諸葛亮、6 劉備）。再點一次拿掉。",x:"拿掉部隊：點一下拿掉那格的我方或敵方部隊。"};
var tool="t^",L=null,PN=["關","張","趙","黃","諸","劉"];
function blank(c,r){var t=[];for(var y=0;y<r;y++)t.push(Array(c+1).join("."));return {name:"",bg:"grass",cols:c,rows:r,t:t,castle:[1,1],granary:[c-2,r-2],p:[],e:[]}}
function setT(x,y,ch){var s=L.t[y];L.t[y]=s.substr(0,x)+ch+s.substr(x+1)}
function getT(x,y){return L.t[y].charAt(x)}
function same(a,x,y){return a&&a[0]===x&&a[1]===y}
function clearCell(x,y){L.p=L.p.filter(function(c){return !same(c,x,y)});L.e=L.e.filter(function(o){return !(o.x===x&&o.y===y)})}
function occupied(x,y){return same(L.castle,x,y)||same(L.granary,x,y)||L.p.some(function(c){return same(c,x,y)})||L.e.some(function(o){return o.x===x&&o.y===y})}
function apply(x,y,drag){
  if(tool.charAt(0)==="t"){var ch=tool.charAt(1);if((ch==="^"||ch==="M"||ch==="n"||ch==="~"||ch==="#")&&occupied(x,y))return;setT(x,y,ch)}   // 有部隊或建築的格子不能改成不能走的地形
  else if(drag)return;                                                                                                   // 建築和部隊只在點的時候放，拖動不連放
  else if(tool==="castle"||tool==="granary"){if(same(L[tool==="castle"?"granary":"castle"],x,y))return;clearCell(x,y);L[tool]=[x,y];setT(x,y,".")}
  else if(tool==="p"){if(L.p.some(function(c){return same(c,x,y)})){L.p=L.p.filter(function(c){return !same(c,x,y)})}else{if(same(L.castle,x,y)||same(L.granary,x,y))return;if(L.p.length>=6){$("#msg").textContent="我方最多 6 格";return}clearCell(x,y);L.p.push([x,y]);if("^~#".indexOf(getT(x,y))>=0)setT(x,y,".")}}
  else if(tool.charAt(0)==="e"){if(same(L.castle,x,y)||same(L.granary,x,y))return;clearCell(x,y);L.e.push({x:x,y:y,typ:tool.charAt(1)});if("^~#".indexOf(getT(x,y))>=0)setT(x,y,".")}
  else if(tool==="x")clearCell(x,y);
  draw();
}
function draw(){
  var sz=Math.max(22,Math.min(44,Math.floor((Math.min($("#mid").clientWidth,640)-24-52)/L.cols)));
  grid.style.gridTemplateColumns="repeat("+L.cols+","+sz+"px)";grid.innerHTML="";
  for(var y=0;y<L.rows;y++)for(var x=0;x<L.cols;x++){var d=document.createElement("div");d.className="c";d.style.height=sz+"px";d.dataset.x=x;d.dataset.y=y;d.dataset.t=getT(x,y);
    var h="";if(same(L.castle,x,y))h='<b class="castle">'+(L.stage?"敵":"城")+'</b>';else if(same(L.granary,x,y))h='<b class="granary">'+(L.stage?"我":"倉")+'</b>';
    else{var pi=-1;L.p.forEach(function(c,i){if(same(c,x,y))pi=i});if(pi>=0)h='<b class="p">'+(pi+1)+PN[pi]+'</b>';else{var e=L.e.filter(function(o){return o.x===x&&o.y===y})[0];if(e)h='<b class="e">'+e.typ+'</b>'}}
    d.innerHTML=h;grid.appendChild(d)}
  $("#name").value=L.name||"";$("#cols").value=L.cols;$("#rows").value=L.rows;$("#bg").value=L.bg||"grass";var gu="url(../img/bf/ground_"+(L.bg||"grass")+".webp)";grid.style.backgroundImage=gu;$("#gwrap").style.backgroundImage=gu;
  $("#hint").innerHTML=(HINT[tool]||"敵方部隊：點格子放一隊。騎兵會去打糧倉，其他守在原地附近。城裡固定有張角守城。")+"　<span style='color:#888'>我方 "+L.p.length+"／6　敵方 "+L.e.length+" 隊</span>";
  if(L.stage)$("#hint").innerHTML="<b style='color:#d4a853'>正式關卡 "+L.name+"</b>　"+(tool==="castle"?"敵方據點（"+KIND(L.mode)[0]+"）：點哪裡就搬到哪裡。":tool==="granary"?"我方據點（"+KIND(L.mode)[1]+"）：點哪裡就搬到哪裡。":(HINT[tool]||""))+"<br><span style='color:#aaa'>部隊不用擺：我方會自動排在最下面兩排，敵方 "+L.need+" 隊排在最上面兩排，這四排請多留空地。</span>";
}
function KIND(m){return m==="siege"?["城","軍營"]:m==="defend"?["軍營","城"]:["軍營","軍營"]}
// 調色盤
TOOLS.forEach(function(t){if(t.sep){var s=document.createElement("span");s.className="sep";$("#pal").appendChild(s);return}
  var b=document.createElement("button");b.dataset.k=t.k;b.innerHTML='<i style="background:'+t.c+'">'+(t.s||"")+'</i>'+t.n;b.onclick=function(){tool=t.k;document.querySelectorAll("#pal button").forEach(function(x){x.classList.toggle("on",x===b)});draw()};if(t.k===tool)b.classList.add("on");$("#pal").appendChild(b)});
for(var i=8;i<=16;i++){["cols","rows"].forEach(function(id){var o=document.createElement("option");o.value=i;o.textContent=i;$("#"+id).appendChild(o)})}
function resize(){var c=+$("#cols").value,r=+$("#rows").value,t=[];for(var y=0;y<r;y++){var s=(L.t[y]||"");while(s.length<c)s+=".";t.push(s.substr(0,c))}L.t=t;L.cols=c;L.rows=r;
  var inb=function(a){return a[0]<c&&a[1]<r};if(!inb(L.castle))L.castle=[Math.min(1,c-1),Math.min(1,r-1)];if(!inb(L.granary))L.granary=[c-2,r-2];L.p=L.p.filter(inb);L.e=L.e.filter(function(o){return o.x<c&&o.y<r});setT(L.castle[0],L.castle[1],".");setT(L.granary[0],L.granary[1],".");draw()}
$("#cols").onchange=resize;$("#rows").onchange=resize;$("#bg").onchange=function(){L.bg=this.value;draw()};$("#name").oninput=function(){L.name=this.value};
// 點和拖
var down=false,last="";function cellAt(e){var el=document.elementFromPoint(e.clientX,e.clientY);while(el&&el!==grid&&!(el.classList&&el.classList.contains("c")))el=el.parentElement;return el&&el!==grid?el:null}
grid.addEventListener("pointerdown",function(e){down=true;var c=cellAt(e);if(c){last=c.dataset.x+","+c.dataset.y;apply(+c.dataset.x,+c.dataset.y,false)}});
grid.addEventListener("pointermove",function(e){if(!down)return;var c=cellAt(e);if(c){var k=c.dataset.x+","+c.dataset.y;if(k!==last){last=k;apply(+c.dataset.x,+c.dataset.y,true)}}});
window.addEventListener("pointerup",function(){down=false});
// 存取
function all(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function fillLoad(){var a=all(),s=$("#load");s.innerHTML='<option value="">載入…</option>';Object.keys(a).forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=k;s.appendChild(o)})}
function check(){if(!L.p.length)return "至少放一格我方出場格";return ""}
// ── 正式關卡（✅ Jay 2026-11-15：8 關草稿由 Claude 排，Jay 用編輯器改）────────────
var MKEY="sg_stage_maps",STG=(window.SG&&SG.STAGES)||[];
function ovr(){try{return JSON.parse(localStorage.getItem(MKEY))||{}}catch(e){return {}}}
function stageMap(){return {cols:L.cols,rows:L.rows,bg:L.bg||"grass",t:L.t.slice(),P:{r:L.granary[1],c:L.granary[0]},E:{r:L.castle[1],c:L.castle[0]}}}
function official(){var on=!!L.stage;document.body.classList.toggle("off",on);$("#splay").style.display=$("#sreset").style.display=on?"":"none";$("#stage").value=L.stage||"";
  var k=KIND(L.mode),bc=document.querySelector('#pal button[data-k="castle"]'),bg=document.querySelector('#pal button[data-k="granary"]');
  bc.lastChild.textContent=on?"敵方"+k[0]:"城";bg.lastChild.textContent=on?"我方"+k[1]:"糧倉";
  if(on&&(tool==="p"||tool==="x"||tool.charAt(0)==="e")){tool="t^";document.querySelectorAll("#pal button").forEach(function(x){x.classList.toggle("on",x.dataset.k===tool)})}}
function loadStage(id,orig){var st=STG.filter(function(x){return x.id===id})[0];if(!st)return;var o=ovr()[id],m=(!orig&&o)||st.map0||st.map;
  L={name:id+" "+st.name,stage:id,mode:st.mode,need:st.enemy.length,bg:m.bg||"grass",cols:m.cols,rows:m.rows,t:m.t.slice(),castle:[m.E.c,m.E.r],granary:[m.P.c,m.P.r],p:[],e:[]};
  official();draw();$("#msg").textContent="已載入 "+id+(!orig&&o?"（你改過的版本）":"（目前的正式版）")}
function checkStage(){var W=L.cols,H=L.rows,blk=function(x,y){return "^Mn~#".indexOf(getT(x,y))>=0},free=function(y){var n=0;for(var x=0;x<W;x++)if(!blk(x,y)&&!same(L.castle,x,y)&&!same(L.granary,x,y))n++;return n};
  if(free(H-1)+free(H-2)<10)return "最下面兩排空地不到 10 格，我方排不下";
  if(free(0)+free(1)<L.need+2)return "最上面兩排空地不夠，敵方 "+L.need+" 隊排不下";
  var seen={},q=[L.granary],ok=false;seen[L.granary[0]+","+L.granary[1]]=1;
  while(q.length){var c=q.shift();[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var x=c[0]+d[0],y=c[1]+d[1];if(x<0||y<0||x>=W||y>=H)return;if(same(L.castle,x,y)){ok=true;return}if(blk(x,y)||seen[x+","+y])return;seen[x+","+y]=1;q.push([x,y])})}
  return ok?"":"我方走不到敵方據點（被山、水或拒馬擋死了），請留一條路或放橋"}
STG.forEach(function(st){var o=document.createElement("option");o.value=st.id;o.textContent=st.id+" "+st.name;$("#stage").appendChild(o)});
$("#stage").onchange=function(){if(this.value)loadStage(this.value);else{L=blank(12,12);official();draw()}};
$("#splay").onclick=function(){var m=checkStage();if(m){$("#msg").textContent=m;return}var o=ovr();o[L.stage]=stageMap();localStorage.setItem(MKEY,JSON.stringify(o));localStorage.setItem("sg_level_draft",JSON.stringify(L));location.href="../index.html?play="+L.stage};
$("#sreset").onclick=function(){var o=ovr();delete o[L.stage];localStorage.setItem(MKEY,JSON.stringify(o));loadStage(L.stage,true);$("#msg").textContent="已還原成目前的正式版"};
$("#save").onclick=function(){if(!L.name){$("#msg").textContent="先取個關卡名稱";return}var a=all();a[L.name]=L;localStorage.setItem(KEY,JSON.stringify(a));fillLoad();$("#load").value=L.name;$("#msg").textContent="已存「"+L.name+"」"};
$("#load").onchange=function(){var a=all();if(a[this.value]){L=JSON.parse(JSON.stringify(a[this.value]));official();draw();$("#msg").textContent="已載入"}};
$("#del").onclick=function(){var k=$("#load").value;if(!k){$("#msg").textContent="先在「載入…」選一個";return}var a=all();delete a[k];localStorage.setItem(KEY,JSON.stringify(a));fillLoad();$("#msg").textContent="已刪除「"+k+"」"};
$("#new").onclick=function(){L=blank(12,12);official();draw();$("#msg").textContent="全新 12×12"};
$("#play").onclick=function(){var m=check();if(m){$("#msg").textContent=m;return}localStorage.setItem("sg_level_test",JSON.stringify(L));localStorage.setItem("sg_level_draft",JSON.stringify(L));location.href="field.html?level=test"};
$("#exp").onclick=function(){if(L.stage){var m0=checkStage();if(m0){$("#msg").textContent=m0;return}}var t=L.stage?"STAGE "+L.stage+" "+JSON.stringify(stageMap()):"LEVEL "+JSON.stringify(L),o=$("#io");o.value=t;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){$("#msg").textContent="已複製，貼給 Claude"},function(){o.select();try{document.execCommand("copy");$("#msg").textContent="已複製"}catch(e){$("#msg").textContent="請長按文字複製"}})};
$("#imp").onclick=function(){try{var raw=$("#io").value.trim(),sm=/^STAGE\s+([\w-]+)\s+(\{[\s\S]*\})$/.exec(raw);
  if(sm){var mm=JSON.parse(sm[2]),sx=STG.filter(function(x){return x.id===sm[1]})[0];if(!sx||!mm.t)throw 0;L={name:sx.id+" "+sx.name,stage:sx.id,mode:sx.mode,need:sx.enemy.length,bg:mm.bg||"grass",cols:mm.cols,rows:mm.rows,t:mm.t,castle:[mm.E.c,mm.E.r],granary:[mm.P.c,mm.P.r],p:[],e:[]};official();draw();$("#msg").textContent="已匯入正式關卡 "+sx.id;return}
  var t=raw.replace(/^LEVEL\s*/,""),o=JSON.parse(t);if(!o.t||!o.cols||!o.rows)throw 0;o.p=o.p||[];o.e=o.e||[];o.castle=o.castle||[1,1];o.granary=o.granary||[o.cols-2,o.rows-2];L=o;draw();$("#msg").textContent="已匯入"}catch(e){$("#msg").textContent="這段文字讀不出來"}};
// 開場：接著上次的草稿，沒有就給一張示範
var draft=null;try{draft=JSON.parse(localStorage.getItem("sg_level_draft"))}catch(e){}
